server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta desconocida -> index.html (routing en cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash (vite) -> cache largo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
